<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Inicia sesión o crea una cuenta de VozYControl.">
<title>VozYControl — Acceso</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip-link" href="#main">Saltar al contenido principal</a>
<div class="app-shell auth-shell">
<header class="auth-brand"><a href="index.html" class="brand brand-dark">VozYControl</a></header>
<main id="main" class="page-pad auth-page">
  <h1 class="page-title auth-title">Tu voz cuenta</h1>
  <p class="intro-copy">Accede para consultar y hacer seguimiento a tus reportes.</p>
  <div class="auth-tabs" role="tablist" aria-label="Opciones de acceso">
    <button class="auth-tab" role="tab" id="tab-login" aria-controls="panel-login" aria-selected="true" type="button">Iniciar sesión</button>
    <button class="auth-tab" role="tab" id="tab-register" aria-controls="panel-register" aria-selected="false" type="button" tabindex="-1">Registrarse</button>
  </div>
  <section class="auth-panel" id="panel-login" role="tabpanel" aria-labelledby="tab-login">
    <form id="login-form" novalidate>
      <div class="field"><label for="login-email">Correo electrónico</label><input type="email" id="login-email" name="email" placeholder="nombre@correo.com" autocomplete="email" required></div>
      <div class="field"><label for="login-password">Contraseña</label><input type="password" id="login-password" name="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" required></div>
      <button type="submit" class="btn btn-accent btn-full">Continuar</button>\n      <p id="login-status" class="form-note" role="status" aria-live="polite" hidden></p>\n      <a class="btn btn-secondary btn-full" href="/api/auth/google">Continuar con Google</a>
    </form>
  </section>
  <section class="auth-panel" id="panel-register" role="tabpanel" aria-labelledby="tab-register" hidden>
    <form id="register-form" novalidate>
      <div class="field"><label for="reg-name">Nombre completo</label><input type="text" id="reg-name" name="nombre" placeholder="Tu nombre completo" autocomplete="name" required></div>
      <div class="field"><label for="reg-email">Correo electrónico</label><input type="email" id="reg-email" name="email" placeholder="nombre@correo.com" autocomplete="email" required></div>
      <div class="field"><label for="reg-password">Contraseña</label><input type="password" id="reg-password" name="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password" minlength="8" required></div>
      <button type="submit" class="btn btn-accent btn-full">Crear cuenta</button>\n      <p id="register-status" class="form-note" role="status" aria-live="polite" hidden></p>
    </form>
  </section>
  <p class="auth-footer">¿Aún no tienes cuenta? <button type="button" class="text-button" id="switch-register">Regístrate aquí</button></p>
  <a class="back-home" href="index.html">← Volver a servicios</a>
</main>
</div>
<script src="js/main.js" defer></script>
</body>
</html>
