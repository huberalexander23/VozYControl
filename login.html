<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Accede o crea tu cuenta de VozYControl.">
<title>VozYControl — Iniciar sesión</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip-link" href="#main">Saltar al contenido principal</a>
<header class="topbar">
  <div class="container topbar-inner">
    <a href="index.html" class="topbar-back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Inicio</a>
    <span class="brand" style="font-size:15px">VozYControl</span>
  </div>
</header>
<main id="main" class="no-tabbar">
  <div class="container page-pad">
    <div class="auth-tabs" role="tablist" aria-label="Opciones de acceso">
      <button class="auth-tab" role="tab" id="tab-login" aria-controls="panel-login" aria-selected="true" type="button">Iniciar sesión</button>
      <button class="auth-tab" role="tab" id="tab-register" aria-controls="panel-register" aria-selected="false" type="button" tabindex="-1">Registrarse</button>
    </div>
    <section class="auth-panel" id="panel-login" role="tabpanel" aria-labelledby="tab-login">
      <form id="login-form" novalidate>
        <div class="field"><label for="login-email">Correo electrónico</label><input type="email" id="login-email" name="email" placeholder="nombre@correo.com" autocomplete="email" required></div>
        <div class="field"><label for="login-password">Contraseña</label><input type="password" id="login-password" name="password" placeholder="Escribe tu contraseña" autocomplete="current-password" required></div>
        <a href="mailto:soporte@vozycontrol.example?subject=Recuperar%20contrase%C3%B1a" class="helper-link">¿Olvidaste tu contraseña? Contacta con soporte.</a>
        <button type="submit" class="btn btn-accent">Continuar</button>
        <p id="login-message" class="service-desc" role="status" aria-live="polite">Prototipo visual: el inicio de sesión requiere conectar un servicio de autenticación.</p>
      </form>
    </section>
    <section class="auth-panel" id="panel-register" role="tabpanel" aria-labelledby="tab-register" hidden>
      <form id="register-form" novalidate>
        <div class="field"><label for="reg-name">Nombre completo</label><input type="text" id="reg-name" name="name" placeholder="María Fernández" autocomplete="name" required></div>
        <div class="field"><label for="reg-email">Correo electrónico</label><input type="email" id="reg-email" name="email" placeholder="nombre@correo.com" autocomplete="email" required></div>
        <div class="field"><label for="reg-password">Contraseña (mínimo 8 caracteres)</label><input type="password" id="reg-password" name="new-password" placeholder="Mínimo 8 caracteres" autocomplete="new-password" minlength="8" required></div>
        <button type="submit" class="btn btn-accent">Crear cuenta</button>
        <p id="register-message" class="service-desc" role="status" aria-live="polite">Prototipo visual: el registro requiere conectar un servicio de usuarios.</p>
      </form>
    </section>
  </div>
</main>
<script src="js/main.js" defer></script>
</body>
</html>
