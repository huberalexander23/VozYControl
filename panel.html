<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Consulta el estado de tus reportes en VozYControl.">
<title>VozYControl — Mi panel</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip-link" href="#main">Saltar al contenido principal</a>
<div class="app-shell">
<header class="dashboard-header">
  <div class="dashboard-header-inner">
    <span class="eyebrow">Hola,</span>
    <h1 class="dashboard-name" id="dashboard-name">María Fernández</h1>
    <a href="#" class="logout-link" data-auth-logout>Salir</a>
  </div>
</header>
<main id="main" class="page-pad dashboard-page">
  <section aria-label="Resumen de reportes">
    <div class="stat-row">
      <article class="stat-card"><div class="stat-value accent" id="active-count">0</div><div class="stat-label">Reportes activos</div></article>
      <article class="stat-card"><div class="stat-value success" id="resolved-count">0</div><div class="stat-label">Resueltos</div></article>
    </div>
  </section>
  <div class="section-heading-row">
    <h2 class="section-title" id="reports-heading">Mis reportes</h2>
    <a href="reportar.html" class="new-report-link">＋ Nuevo reporte</a>
  </div>
  <section aria-label="Lista de reportes" class="report-list" id="report-list">
    <p class="service-desc">Cargando reportes...</p>
  </section>
</main>
<nav class="tabbar" aria-label="Navegación principal">
  <a class="tab" href="panel.html" aria-current="page"><span aria-hidden="true">⌂</span>Inicio</a>
  <a class="tab" href="index.html"><span aria-hidden="true">⌕</span>Buscar</a>
  <a class="tab" href="reportar.html"><span aria-hidden="true">＋</span>Reportar</a>
  <a class="tab" href="perfil.html"><span aria-hidden="true">♙</span>Perfil</a>
</nav>
</div>
<script src="js/main.js" defer></script>
</body>
</html>
