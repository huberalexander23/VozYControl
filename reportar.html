<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Prepara un reporte ciudadano de fallas o negación de servicios públicos.">
<title>VozYControl — Nuevo reporte</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip-link" href="#main">Saltar al contenido principal</a>
<div class="app-shell">
<header class="subpage-header">
  <a href="panel.html" class="back-link">← Panel</a>
  <h1>Nuevo reporte</h1>
  <span aria-hidden="true"></span>
</header>
<main id="main" class="page-pad report-page">
  <form id="report-form" novalidate>
    <div class="field"><label for="categoria">Categoría del servicio <span aria-hidden="true">*</span><span class="visually-hidden"> (obligatorio)</span></label>
      <select id="categoria" name="categoria" required aria-describedby="categoria-error"><option value="">Selecciona una categoría</option><option>Agua potable</option><option>Salud</option><option>Educación</option><option>Energía</option></select>
      <p class="field-error" id="categoria-error" hidden>Selecciona una categoría.</p>
    </div>
    <div class="field"><label for="ubicacion">Ubicación <span aria-hidden="true">*</span><span class="visually-hidden"> (obligatorio)</span></label>
      <input type="text" id="ubicacion" name="ubicacion" placeholder="Barrio, dirección o punto de referencia" autocomplete="street-address" required aria-describedby="ubicacion-error">
      <p class="field-error" id="ubicacion-error" hidden>Indica dónde ocurrió el hecho.</p>
    </div>
    <div class="field"><label for="descripcion">Descripción del hecho <span aria-hidden="true">*</span><span class="visually-hidden"> (obligatorio)</span></label>
      <textarea id="descripcion" name="descripcion" placeholder="Describe qué ocurrió, cuándo y cómo te afectó..." required aria-describedby="descripcion-error"></textarea>
      <p class="field-error" id="descripcion-error" hidden>Describe brevemente lo ocurrido.</p>
    </div>
    <fieldset class="evidence-field">
      <legend>Evidencia (foto o documento)</legend>
      <label class="file-drop" for="evidencia">
        <span class="upload-icon" aria-hidden="true">↑</span>
        <span class="file-drop-label">Adjuntar archivo</span>
        <span class="file-drop-name" id="file-name" aria-live="polite">Ningún archivo seleccionado</span>
      </label>
      <input type="file" id="evidencia" name="evidencia" accept="image/*,.pdf">
    </fieldset>
    <button type="submit" class="btn btn-accent btn-full">Preparar reporte</button>
  </form>
  <section class="success-panel" id="success-panel" aria-labelledby="success-title" tabindex="-1" hidden>
    <div class="success-icon" aria-hidden="true">✓</div>
    <h2 id="success-title">Reporte preparado</h2>
    <a href="panel.html" class="btn btn-secondary">Volver al panel</a>
  </section>
</main>
<nav class="tabbar" aria-label="Navegación principal">
  <a class="tab" href="panel.html"><span aria-hidden="true">⌂</span>Inicio</a>
  <a class="tab" href="index.html"><span aria-hidden="true">⌕</span>Buscar</a>
  <a class="tab" href="reportar.html" aria-current="page"><span aria-hidden="true">＋</span>Reportar</a>
  <a class="tab" href="perfil.html"><span aria-hidden="true">♙</span>Perfil</a>
</nav>
</div>
<script src="js/main.js" defer></script>
</body>
</html>
